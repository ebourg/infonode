# Github action building the project with different versions of Java.

name: build

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ contrib ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 11, 17, 21 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: |
          mvn -version
          mvn -B clean compile

      - name: Tests
        run: mvn -B test

      - name: Packaging
        run: mvn -B package -DskipTests

      - name: Archive artifacts
        if: ${{ matrix.java == '8' }}
        uses: actions/upload-artifact@v4
        with:
          name: infonode-docking-windows-artifacts
          path: |
            target/infonode-docking-windows-*.jar
            !target/infonode-docking-windows-*-javadoc.jar
            !target/infonode-docking-windows-*-sources.jar
            !target/infonode-docking-windows-*-tests.jar

  experimental:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 'Set up Java EA'
        uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: EA
          cache: 'maven'          

      - name: Build
        run: |
          mvn -version
          mvn -B clean package || true
